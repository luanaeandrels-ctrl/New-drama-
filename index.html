
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umbrella - Doramas, K-Pop & Animes</title>
  <style>
    :root {
      --bg-dark: #060a1e;
      --card-bg: rgba(20, 24, 42, 0.92);
      --card-border: rgba(139, 92, 246, 0.35);
      --accent-purple: #8b5cf6;
      --accent-blue: #38bdf8;
      --accent-gold: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      background: rgba(6, 10, 30, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.25rem; color: var(--accent-gold); }
    .brand span { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }

    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input, textarea, select {
      width: 100%;
      background: rgba(10, 12, 22, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      margin-bottom: 10px;
      outline: none;
    }

    .btn {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-gold { background: var(--accent-gold); color: #060a1e; }

    .media-actions { display: flex; gap: 8px; margin-bottom: 10px; }
    .custom-file-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .post-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div>
        <h1>Umbrella</h1>
        <span>Doramas • K-Pop • Animes</span>
      </div>
    </div>
    <button class="btn" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="loginGoogle()">🔑 Entrar</button>
  </header>

  <div class="container">
    <!-- Desafio de Hoje -->
    <div class="card">
      <div class="card-title">
        <span>☔ Desafio de Hoje</span>
        <span style="font-size: 0.8rem; color: var(--accent-blue);">Votos: 0/3</span>
      </div>
      <p style="font-size: 0.9rem; margin-bottom: 10px; font-weight: 600;">Encontre uma foto do Bias Nº 20 com guarda-chuva!</p>
      
      <input type="text" id="challengeCaption" placeholder="Legenda da sua participação..." />
      
      <div class="media-actions">
        <label class="custom-file-btn">
          📷 Câmera
          <input type="file" accept="image/*" capture="environment" hidden onchange="previewMedia(event)" />
        </label>
        <label class="custom-file-btn">
          🖼️ Galeria
          <input type="file" accept="image/*" hidden onchange="previewMedia(event)" />
        </label>
      </div>

      <button class="btn btn-gold" onclick="submitChallenge()">Participar do Desafio</button>
    </div>

    <!-- Feed Global -->
    <div class="card">
      <textarea id="feedText" rows="2" placeholder="O que vamos proteger hoje sob o guarda-chuva?"></textarea>
      <button class="btn" onclick="publishPost()">Publicar no Feed</button>
    </div>

    <div id="feedContainer">
      <div class="post-item">
        <div style="font-weight: 700; margin-bottom: 6px; color: var(--accent-blue);">Camila_Doramas</div>
        <p style="font-size: 0.9rem;">Alguém maratonando dorama hoje à noite? ☔🎬</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDN2_2jfvTIhUI2SkTAjy9uZQgXt9ulgO4",
      authDomain: "new-drama-e729b.firebaseapp.com",
      projectId: "new-drama-e729b",
      storageBucket: "new-drama-e729b.firebasestorage.app",
      messagingSenderId: "1038068499530",
      appId: "1:1038068499530:web:44fd33a0a628bcad4ad2b3",
      measurementId: "G-VXNH7S6N36"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.loginGoogle = () => {
      signInWithPopup(auth, provider)
        .then(res => alert("Logado com sucesso: " + res.user.displayName))
        .catch(err => alert("Erro no login: " + err.message));
    };

    window.previewMedia = (e) => {
      if (e.target.files && e.target.files[0]) {
        alert("Mídia selecionada com sucesso!");
      }
    };

    window.submitChallenge = () => {
      alert("Participação enviada para o desafio!");
    };

    window.publishPost = () => {
      const txt = document.getElementById('feedText').value.trim();
      if (!txt) return alert("Escreva algo!");
      
      const container = document.getElementById('feedContainer');
      container.innerHTML = `
        <div class="post-item">
          <div style="font-weight: 700; margin-bottom: 6px; color: var(--accent-blue);">Luana</div>
          <p style="font-size: 0.9rem;">${txt}</p>
        </div>
      ` + container.innerHTML;
      
      document.getElementById('feedText').value = "";
    };
  </script>
</body>
</html>
