<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SherBluss</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#060a1e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #070b14;
      --bg-card: rgba(14, 21, 36, 0.85);
      --bg-card-solid: #0e1524;
      --accent: #e5b84b;
      --accent-soft: rgba(229, 184, 75, 0.18);
      --text-main: #f4f6fb;
      --text-muted: #9aa6c0;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --danger: #ff5c77;
      --success: #3dd598;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 45%, rgba(164, 118, 178, 0.22), transparent 60%),
        radial-gradient(ellipse 75% 45% at 75% 55%, rgba(229, 184, 75, 0.18), transparent 60%),
        radial-gradient(ellipse 90% 60% at 50% 80%, rgba(56, 97, 168, 0.25), transparent 65%),
        linear-gradient(160deg, #060a12 0%, #0b1221 50%, #070b14 100%);
    }

    .ambient-wave {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background: conic-gradient(
        from 210deg at 50% 50%,
        transparent 0deg,
        rgba(229, 184, 75, 0.08) 60deg,
        rgba(147, 112, 219, 0.12) 140deg,
        rgba(65, 131, 215, 0.1) 220deg,
        transparent 360deg
      );
      filter: blur(45px);
      transform: rotate(-12deg);
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(7, 11, 20, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      gap: 10px;
      min-height: 68px;
    }

    .profile-trigger-wrap {
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
    }

    .header-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      object-fit: cover;
      display: block;
      box-shadow: 0 0 14px var(--accent-soft);
      transition: transform 0.2s ease, border-color 0.3s ease;
    }

    .profile-trigger-wrap:active .header-avatar {
      transform: scale(0.94);
    }

    .notif-droplet {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 6px rgba(56, 189, 248, 0.85));
      animation: dropletPulse 2s infinite ease-in-out;
      transition: opacity 0.25s ease, transform 0.25s ease;
      cursor: pointer;
      z-index: 5;
    }

    .notif-droplet.hidden {
      opacity: 0;
      transform: scale(0);
      pointer-events: none;
    }

    @keyframes dropletPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.1); }
    }

    .header-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-width: 0;
    }

    .app-brand-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.38rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #fff6d6 0%, var(--accent) 55%, #d4943a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, max-height 0.35s ease;
      max-height: 40px;
      opacity: 1;
      transform: translateY(0);
      user-select: none;
    }

    .top-header.scrolled .app-brand-title {
      transform: translateY(-34px);
      opacity: 0;
      max-height: 0;
      pointer-events: none;
    }

    .search-bar-box {
      display: none;
      align-items: center;
      width: 100%;
      background: rgba(16, 24, 41, 0.95);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 6px 12px;
      gap: 8px;
      animation: expandSearch 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .search-bar-box.active {
      display: flex;
    }

    @keyframes expandSearch {
      from { opacity: 0; transform: scaleX(0.75); transform-origin: right; }
      to { opacity: 1; transform: scaleX(1); }
    }

    .search-bar-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: inherit;
    }

    .search-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 4px;
    }

    .search-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cfe4ff;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .search-icon-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .search-icon-btn.hidden {
      display: none;
    }

    .main-container {
      position: relative;
      z-index: 10;
      max-width: 540px;
      margin: 0 auto;
      padding: 16px 16px 110px;
    }

    .podium-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
      text-align: center;
    }

    .podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .podium-item:active {
      transform: scale(0.96);
    }

    .podium-circle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 2.5px solid var(--accent);
      padding: 3px;
      background: rgba(12, 18, 32, 0.8);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), 0 0 14px var(--accent-soft);
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    .podium-circle img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .podium-rank {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .podium-status {
      font-size: 0.74rem;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 14px 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-author img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      object-fit: cover;
    }

    .post-author-info h4 {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .post-author-info span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .post-tag {
      font-size: 0.7rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(229, 184, 75, 0.3);
      font-weight: 600;
    }

    .post-text {
      font-size: 0.92rem;
      line-height: 1.5;
      color: #e6ebf5;
      white-space: pre-wrap;
    }

    .post-image {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid var(--border-subtle);
    }

    .bottom-composer-wrapper {
      position: fixed;
      bottom: 18px;
      right: 16px;
      left: 16px;
      z-index: 60;
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
    }

    .collapsed-send-fab {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(14, 21, 36, 0.92);
      border: 1.5px solid var(--accent);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6), 0 0 16px var(--accent-soft);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }

    .collapsed-send-fab:active {
      transform: scale(0.92);
    }

    .collapsed-send-fab.hidden {
      display: none;
    }

    .expanded-composer-panel {
      width: 100%;
      background: rgba(11, 17, 30, 0.95);
      border: 1.5px solid var(--accent);
      border-radius: 28px;
      padding: 10px 12px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.75), 0 0 20px var(--accent-soft);
      backdrop-filter: blur(16px);
      pointer-events: auto;
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: expandBar 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .expanded-composer-panel.active {
      display: flex;
    }

    @keyframes expandBar {
      from { opacity: 0; transform: scale(0.85) translateY(10px); transform-origin: bottom right; }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .composer-preview-strip {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
    }

    .composer-preview-strip.active {
      display: flex;
    }

    .composer-preview-strip img {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--accent);
    }

    .remove-preview-btn {
      background: rgba(255, 92, 119, 0.2);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .composer-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .plus-gallery-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .composer-text-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.94rem;
      font-family: inherit;
    }

    .composer-text-input::placeholder {
      color: var(--text-muted);
    }

    .composer-submit-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid var(--accent);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .composer-submit-btn:active {
      transform: scale(0.92);
      background: var(--accent-soft);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(3, 6, 12, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .sheet-modal {
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--bg-card-solid);
      border-top: 1.5px solid var(--accent);
      border-radius: 24px 24px 0 0;
      padding: 20px 18px 34px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      animation: slideSheet 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideSheet {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .sheet-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--accent);
    }

    .close-sheet-btn {
      background: rgba(255, 255, 255, 0.07);
      border: none;
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .notif-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .notif-info p {
      font-size: 0.86rem;
      line-height: 1.4;
    }

    .notif-info span {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .notif-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-accept {
      background: var(--accent);
      color: #070b14;
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-decline {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.76rem;
      cursor: pointer;
    }

    .profile-view-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: var(--bg-deep);
      overflow-y: auto;
      display: none;
      padding-bottom: 40px;
    }

    .profile-view-overlay.active {
      display: block;
      animation: fadeUp 0.25s ease;
    }

    .profile-container {
      max-width: 540px;
      margin: 0 auto;
    }

    .profile-banner {
      height: 155px;
      background: linear-gradient(135deg, #1b2845 0%, #3b264c 50%, var(--accent) 140%);
      position: relative;
      background-size: cover;
      background-position: center;
    }

    .profile-nav-bar {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .circle-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(7, 11, 20, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      font-size: 1.1rem;
    }

    .three-dots-wrapper {
      position: relative;
    }

    .dots-dropdown {
      position: absolute;
      top: 44px;
      right: 0;
      background: #121b2e;
      border: 1px solid var(--accent);
      border-radius: 14px;
      min-width: 185px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 20;
    }

    .dots-dropdown.active {
      display: flex;
    }

    .dots-dropdown button {
      background: none;
      border: none;
      color: var(--text-main);
      padding: 12px 14px;
      text-align: left;
      font-size: 0.86rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .dots-dropdown button:last-child {
      border-bottom: none;
    }

    .dots-dropdown button:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .profile-avatar-section {
      padding: 0 18px;
      margin-top: -46px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .profile-big-avatar-wrap {
      position: relative;
      width: 92px;
      height: 92px;
    }

    .profile-big-avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      object-fit: cover;
      background: #0e1524;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .edit-photo-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #070b14;
      border: 2px solid #070b14;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .saved-status-pill {
      font-size: 0.76rem;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(61, 213, 152, 0.14);
      color: var(--success);
      border: 1px solid rgba(61, 213, 152, 0.35);
      font-weight: 600;
    }

    .profile-body {
      padding: 16px 18px;
    }

    .profile-display-name {
      font-size: 1.32rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-display-handle {
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
    }

    .profile-display-bio {
      margin-top: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #dce3f2;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
    }

    .profile-stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }

    .stat-box strong {
      display: block;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .stat-box span {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .profile-info-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .info-card-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .info-card-item label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .info-card-item p {
      font-size: 0.88rem;
      color: var(--text-main);
    }

    .profile-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .form-section-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      margin-top: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 11px 13px;
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    textarea.form-control {
      min-height: 78px;
      resize: vertical;
    }

    .color-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .color-swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .color-swatch.selected {
      border-color: #ffffff;
      transform: scale(1.14);
      box-shadow: 0 0 12px currentColor;
    }

    .save-profile-btn {
      margin-top: 10px;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #070b14;
      font-size: 0.96rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--accent-soft);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .save-profile-btn:active {
      transform: scale(0.98);
    }

    .toast-banner {
      position: fixed;
      top: 78px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #111a2e;
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.65);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
      white-space: nowrap;
    }

    .toast-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden-block {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="ambient-wave"></div>

  <div id="toast" class="toast-banner">Salvo com sucesso!</div>

  <header class="top-header" id="topHeader">
    <div class="profile-trigger-wrap" id="avatarContainer">
      <img
        id="headerAvatarImg"
        class="header-avatar"
        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80"
        alt="Perfil"
        onclick="openProfileModal()"
      />
      <div
        id="notifDroplet"
        class="notif-droplet"
        title="Notificações pendentes"
        onclick="event.stopPropagation(); openNotifModal();"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="url(#dropGrad)">
          <defs>
            <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#bae6fd" />
              <stop offset="50%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#0284c7" />
            </linearGradient>
          </defs>
          <path d="M12 2.2C12 2.2 5 10.1 5 15.2C5 19.1 8.1 22 12 22C15.9 22 19 19.1 19 15.2C19 10.1 12 2.2 12 2.2Z" />
        </svg>
      </div>
    </div>

    <div class="header-center">
      <div id="brandTitle" class="app-brand-title">SherBluss</div>

      <div id="searchBarBox" class="search-bar-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa6c0" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Pesquisar doramas, fandoms, @arroba..."
          oninput="filterFeed(this.value)"
        />
        <button class="search-close-btn" onclick="closeSearchBar()" aria-label="Fechar busca">✕</button>
      </div>
    </div>

    <button id="searchTriggerBtn" class="search-icon-btn" onclick="openSearchBar()" aria-label="Pesquisar">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7.5"></circle>
        <line x1="20.5" y1="20.5" x2="16.35" y2="16.35"></line>
      </svg>
    </button>
  </header>

  <main class="main-container">
    <section class="podium-row">
      <div class="podium-item" onclick="showToast('1º Pódio: Aguardando votação')">
        <div class="podium-circle">
          <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=240&q=80" alt="1º Pódio" />
        </div>
        <div class="podium-rank">1º Pódio</div>
        <div class="podium-status">Aguardando</div>
      </div>

      <div class="podium-item" onclick="showToast('2º Pódio: Aguardando votação')">
        <div class="podium-circle">
          <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=240&q=80" alt="2º Pódio" />
        </div>
        <div class="podium-rank">2º Pódio</div>
        <div class="podium-status">Aguardando</div>
      </div>

      <div class="podium-item" onclick="showToast('3º Pódio: Aguardando votação')">
        <div class="podium-circle">
          <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=240&q=80" alt="3º Pódio" />
        </div>
        <div class="podium-rank">3º Pódio</div>
        <div class="podium-status">Aguardando</div>
      </div>
    </section>

    <section id="feedList" class="feed-list"></section>
  </main>

  <div class="bottom-composer-wrapper" id="composerWrapper">
    <button
      id="collapsedSendFab"
      class="collapsed-send-fab"
      onclick="expandComposer()"
      aria-label="Escrever no SherBluss"
    >
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
      </svg>
    </button>

    <div id="expandedComposerPanel" class="expanded-composer-panel">
      <div id="composerPreviewStrip" class="composer-preview-strip">
        <img id="composerPreviewImg" src="" alt="Prévia" />
        <button class="remove-preview-btn" onclick="clearComposerImage()">Remover foto</button>
      </div>

      <div class="composer-input-row">
        <button class="plus-gallery-btn" onclick="document.getElementById('postImageInput').click()" title="Adicionar da galeria">+</button>
        <input type="file" id="postImageInput" accept="image/*" class="hidden-block" onchange="handlePostImageSelect(event)" />

        <input
          type="text"
          id="composerTextInput"
          class="composer-text-input"
          placeholder="Escreva no SherBluss..."
          onkeydown="if(event.key==='Enter') submitPost()"
        />

        <button class="composer-submit-btn" onclick="submitPost()" title="Enviar">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="notifModal" class="modal-overlay" onclick="if(event.target===this) closeNotifModal()">
    <div class="sheet-modal">
      <div class="sheet-top-bar">
        <span class="sheet-title">Notificações</span>
        <button class="close-sheet-btn" onclick="closeNotifModal()">✕</button>
      </div>
      <div id="notifListContainer"></div>
    </div>
  </div>

  <div id="profileModal" class="profile-view-overlay">
    <div class="profile-container">
      <div id="profileBanner" class="profile-banner">
        <div class="profile-nav-bar">
          <button class="circle-icon-btn" onclick="closeProfileModal()" title="Voltar">←</button>

          <div id="threeDotsContainer" class="three-dots-wrapper hidden-block">
            <button class="circle-icon-btn" onclick="toggleDotsMenu()" aria-label="Opções do perfil">⋮</button>
            <div id="dotsDropdown" class="dots-dropdown">
              <button onclick="switchToEditMode()">✏️ Editar perfil</button>
              <button onclick="document.getElementById('bannerFileInput').click(); toggleDotsMenu();">🖼️ Alterar capa</button>
              <button onclick="closeProfileModal()">🏠 Voltar ao início</button>
            </div>
          </div>
        </div>
        <input type="file" id="bannerFileInput" accept="image/*" class="hidden-block" onchange="handleBannerUpload(event)" />
      </div>

      <div class="profile-avatar-section">
        <div class="profile-big-avatar-wrap">
          <img
            id="profileBigAvatar"
            class="profile-big-avatar"
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=240&q=80"
            alt="Avatar"
          />
          <button
            id="editAvatarBadge"
            class="edit-photo-badge"
            onclick="document.getElementById('avatarFileInput').click()"
            title="Trocar foto"
          >📷</button>
          <input type="file" id="avatarFileInput" accept="image/*" class="hidden-block" onchange="handleAvatarUpload(event)" />
        </div>

        <span id="savedStatusBadge" class="saved-status-pill hidden-block">✓ Perfil Salvo</span>
      </div>

      <div class="profile-body">
        <div id="profileViewMode" class="hidden-block">
          <div class="profile-display-name" id="viewDisplayName"></div>
          <div class="profile-display-handle" id="viewDisplayHandle"></div>
          <p class="profile-display-bio" id="viewDisplayBio"></p>

          <div class="profile-stats-row">
            <div class="stat-box">
              <strong id="statFriendsCount">0</strong>
              <span>Amigos</span>
            </div>
            <div class="stat-box">
              <strong id="statFandomsCount">0</strong>
              <span>Fandoms</span>
            </div>
            <div class="stat-box">
              <strong id="statPostsCount">0</strong>
              <span>Posts</span>
            </div>
          </div>

          <div class="profile-info-grid">
            <div class="info-card-item">
              <label>Meu Fandom & Utt / Bias</label>
              <p id="viewFandomBias">—</p>
            </div>
            <div class="info-card-item">
              <label>Dorama & Anime Favoritos</label>
              <p id="viewDoramaAnime">—</p>
            </div>
            <div class="info-card-item">
              <label>Sobre Mim</label>
              <p id="viewAboutInterview">—</p>
            </div>
            <div class="info-card-item">
              <label>E-mail & Contato</label>
              <p id="viewEmail">—</p>
            </div>
          </div>
        </div>

        <form id="profileEditForm" class="profile-form" onsubmit="event.preventDefault(); saveProfileData();">
          <div class="form-section-title">Identidade do Perfil</div>

          <div class="form-group">
            <label>Nome de Exibição</label>
            <input type="text" id="inputName" class="form-control" placeholder="Digite seu nome" required />
          </div>

          <div class="form-group">
            <label>Seu @arroba</label>
            <input type="text" id="inputHandle" class="form-control" placeholder="@seu_arroba" required />
          </div>

          <div class="form-group">
            <label>Bio curta</label>
            <textarea id="inputBio" class="form-control" placeholder="Escreva uma bio..."></textarea>
          </div>

          <div class="form-group">
            <label>Cor de destaque do seu perfil</label>
            <div class="color-swatches" id="colorSwatches">
              <button type="button" class="color-swatch" data-color="#e5b84b" style="background:#e5b84b; color:#e5b84b;"></button>
              <button type="button" class="color-swatch" data-color="#ff6b9d" style="background:#ff6b9d; color:#ff6b9d;"></button>
              <button type="button" class="color-swatch" data-color="#a78bfa" style="background:#a78bfa; color:#a78bfa;"></button>
              <button type="button" class="color-swatch" data-color="#38bdf8" style="background:#38bdf8; color:#38bdf8;"></button>
              <button type="button" class="color-swatch" data-color="#34d399" style="background:#34d399; color:#34d399;"></button>
              <button type="button" class="color-swatch" data-color="#fb7185" style="background:#fb7185; color:#fb7185;"></button>
            </div>
          </div>

          <div class="form-section-title">Preferências & Entrevista</div>

          <div class="form-group">
            <label>Fandom principal e Bias / Utt</label>
            <input type="text" id="inputFandomBias" class="form-control" placeholder="Ex: Seus grupos/atores favoritos" />
          </div>

          <div class="form-group">
            <label>Dorama e Anime favoritos</label>
            <input type="text" id="inputDoramaAnime" class="form-control" placeholder="Seus favoritos" />
          </div>

          <div class="form-group">
            <label>Sobre você</label>
            <textarea id="inputAboutInterview" class="form-control" placeholder="Conte um pouco sobre você..."></textarea>
          </div>

          <div class="form-section-title">Conta & Segurança</div>

          <div class="form-group">
            <label>E-mail da conta</label>
            <input type="email" id="inputEmail" class="form-control" placeholder="voce@email.com" />
          </div>

          <div class="form-group">
            <label>Nova Senha</label>
            <input type="password" id="inputPassword" class="form-control" placeholder="••••••••" />
          </div>

          <button type="submit" class="save-profile-btn">Salvar Perfil</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'sherbluss_state_clean_v1';

    const defaultState = {
      isProfileSaved: false,
      profile: {
        name: '',
        handle: '',
        bio: '',
        accentColor: '#e5b84b',
        fandomBias: '',
        doramaAnime: '',
        aboutInterview: '',
        email: '',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=240&q=80',
        banner: '',
        friendsCount: 0,
        fandomsCount: 0
      },
      notifications: [],
      posts: [
        {
          id: 101,
          author: 'SherBluss Oficial',
          handle: '@sherbluss',
          avatar: 'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=120&q=80',
          tag: 'Destaques',
          text: 'Bem-vindo ao SherBluss! Personalize seu perfil e compartilhe seus momentos.'
        }
      ]
    };

    let state = loadState();
    let pendingPostImage = '';

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function applyAccentColor(hex) {
      document.documentElement.style.setProperty('--accent', hex);
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      document.documentElement.style.setProperty('--accent-soft', `rgba(${r}, ${g}, ${b}, 0.2)`);
    }

    window.addEventListener('scroll', () => {
      const header = document.getElementById('topHeader');
      const searchActive = document.getElementById('searchBarBox').classList.contains('active');
      if (!searchActive && window.scrollY > 28) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });

    function openSearchBar() {
      document.getElementById('brandTitle').classList.add('hidden-block');
      document.getElementById('searchTriggerBtn').classList.add('hidden');
      const box = document.getElementById('searchBarBox');
      box.classList.add('active');
      document.getElementById('searchInput').focus();
    }

    function closeSearchBar() {
      document.getElementById('searchBarBox').classList.remove('active');
      document.getElementById('brandTitle').classList.remove('hidden-block');
      document.getElementById('searchTriggerBtn').classList.remove('hidden');
      document.getElementById('searchInput').value = '';
      renderFeed();
    }

    function updateDropletVisibility() {
      const droplet = document.getElementById('notifDroplet');
      if (state.notifications.length > 0) {
        droplet.classList.remove('hidden');
      } else {
        droplet.classList.add('hidden');
      }
    }

    function openNotifModal() {
      renderNotifications();
      document.getElementById('notifModal').classList.add('active');
    }

    function closeNotifModal() {
      document.getElementById('notifModal').classList.remove('active');
    }

    function renderNotifications() {
      const container = document.getElementById('notifListContainer');
      if (state.notifications.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); font-size:0.88rem; text-align:center; padding:20px 0;">Nenhuma notificação pendente.</p>';
        return;
      }
      container.innerHTML = state.notifications.map(n => `
        <div class="notif-card">
          <div class="notif-info">
            <p>${n.text}</p>
            <span>${n.time}</span>
          </div>
        </div>
      `).join('');
    }

    function expandComposer() {
      document.getElementById('collapsedSendFab').classList.add('hidden');
      document.getElementById('expandedComposerPanel').classList.add('active');
      document.getElementById('composerTextInput').focus();
    }

    function collapseComposer() {
      document.getElementById('expandedComposerPanel').classList.remove('active');
      document.getElementById('collapsedSendFab').classList.remove('hidden');
    }

    document.addEventListener('click', (e) => {
      const wrapper = document.getElementById('composerWrapper');
      const panel = document.getElementById('expandedComposerPanel');
      if (panel.classList.contains('active') && !wrapper.contains(e.target)) {
        const textVal = document.getElementById('composerTextInput').value.trim();
        if (!textVal && !pendingPostImage) {
          collapseComposer();
        }
      }
    });

    function handlePostImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        pendingPostImage = e.target.result;
        document.getElementById('composerPreviewImg').src = pendingPostImage;
        document.getElementById('composerPreviewStrip').classList.add('active');
      };
      reader.readAsDataURL(file);
    }

    function clearComposerImage() {
      pendingPostImage = '';
      document.getElementById('postImageInput').value = '';
      document.getElementById('composerPreviewStrip').classList.remove('active');
    }

    function submitPost() {
      const input = document.getElementById('composerTextInput');
      const text = input.value.trim();
      if (!text && !pendingPostImage) {
        collapseComposer();
        return;
      }

      const newPost = {
        id: Date.now(),
        author: state.profile.name || 'Anônimo',
        handle: state.profile.handle || '@usuario',
        avatar: state.profile.avatar,
        tag: 'SherBluss',
        text: text,
        image: pendingPostImage || null
      };

      state.posts.unshift(newPost);
      persistState();

      input.value = '';
      clearComposerImage();
      renderFeed();
      collapseComposer();
      showToast('Publicado com sucesso!');
    }

    function renderFeed(query = '') {
      const list = document.getElementById('feedList');
      const q = query.toLowerCase().trim();
      const filtered = q
        ? state.posts.filter(p =>
            p.text.toLowerCase().includes(q) ||
            p.author.toLowerCase().includes(q) ||
            p.handle.toLowerCase().includes(q) ||
            p.tag.toLowerCase().includes(q)
          )
        : state.posts;

      if (filtered.length === 0) {
        list.innerHTML = '<div class="post-card" style="text-align:center; color:var(--text-muted);">Nenhuma publicação encontrada.</div>';
        return;
      }

      list.innerHTML = filtered.map(post => `
        <article class="post-card">
          <div class="post-header">
            <div class="post-author">
              <img src="${post.avatar}" alt="${post.author}" />
              <div class="post-author-info">
                <h4>${post.author}</h4>
                <span>${post.handle}</span>
              </div>
            </div>
            <span class="post-tag">${post.tag}</span>
          </div>
          ${post.text ? `<p class="post-text">${escapeHtml(post.text)}</p>` : ''}
          ${post.image ? `<img class="post-image" src="${post.image}" alt="Imagem do post" />` : ''}
        </article>
      `).join('');
    }

    function filterFeed(val) {
      renderFeed(val);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function openProfileModal() {
      syncProfileUI();
      if (state.isProfileSaved) {
        switchToViewMode();
      } else {
        switchToEditMode();
      }
      document.getElementById('profileModal').classList.add('active');
    }

    function closeProfileModal() {
      document.getElementById('dotsDropdown').classList.remove('active');
      document.getElementById('profileModal').classList.remove('active');
    }

    function toggleDotsMenu() {
      document.getElementById('dotsDropdown').classList.toggle('active');
    }

    function switchToViewMode() {
      document.getElementById('dotsDropdown').classList.remove('active');
      document.getElementById('profileEditForm').classList.add('hidden-block');
      document.getElementById('editAvatarBadge').classList.add('hidden-block');

      document.getElementById('profileViewMode').classList.remove('hidden-block');
      document.getElementById('threeDotsContainer').classList.remove('hidden-block');
      document.getElementById('savedStatusBadge').classList.remove('hidden-block');
      syncProfileUI();
    }

    function switchToEditMode() {
      document.getElementById('dotsDropdown').classList.remove('active');
      document.getElementById('profileViewMode').classList.add('hidden-block');
      document.getElementById('threeDotsContainer').classList.add('hidden-block');
      document.getElementById('savedStatusBadge').classList.add('hidden-block');

      document.getElementById('profileEditForm').classList.remove('hidden-block');
      document.getElementById('editAvatarBadge').classList.remove('hidden-block');
      populateEditForm();
    }

    function populateEditForm() {
      const p = state.profile;
      document.getElementById('inputName').value = p.name;
      document.getElementById('inputHandle').value = p.handle;
      document.getElementById('inputBio').value = p.bio;
      document.getElementById('inputFandomBias').value = p.fandomBias;
      document.getElementById('inputDoramaAnime').value = p.doramaAnime;
      document.getElementById('inputAboutInterview').value = p.aboutInterview;
      document.getElementById('inputEmail').value = p.email;
      document.getElementById('inputPassword').value = '';

      document.querySelectorAll('.color-swatch').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.color.toLowerCase() === p.accentColor.toLowerCase());
      });
    }

    document.querySelectorAll('.color-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        const chosen = btn.dataset.color;
        state.profile.accentColor = chosen;
        applyAccentColor(chosen);
        document.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        state.profile.avatar = e.target.result;
        document.getElementById('profileBigAvatar').src = e.target.result;
        document.getElementById('headerAvatarImg').src = e.target.result;
        persistState();
        showToast('Foto atualizada!');
      };
      reader.readAsDataURL(file);
    }

    function handleBannerUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        state.profile.banner = e.target.result;
        document.getElementById('profileBanner').style.backgroundImage = `url(${e.target.result})`;
        persistState();
        showToast('Capa atualizada!');
      };
      reader.readAsDataURL(file);
    }

    function saveProfileData() {
      let rawHandle = document.getElementById('inputHandle').value.trim();
      if (rawHandle && !rawHandle.startsWith('@')) rawHandle = '@' + rawHandle;
      rawHandle = rawHandle.replace(/\s+/g, '_');

      state.profile.name = document.getElementById('inputName').value.trim();
      state.profile.handle = rawHandle;
      state.profile.bio = document.getElementById('inputBio').value.trim();
      state.profile.fandomBias = document.getElementById('inputFandomBias').value.trim();
      state.profile.doramaAnime = document.getElementById('inputDoramaAnime').value.trim();
      state.profile.aboutInterview = document.getElementById('inputAboutInterview').value.trim();
      state.profile.email = document.getElementById('inputEmail').value.trim();

      state.isProfileSaved = true;
      persistState();
      syncProfileUI();
      switchToViewMode();
      showToast('Perfil salvo com sucesso!');
    }

    function syncProfileUI() {
      const p = state.profile;
      applyAccentColor(p.accentColor);

      document.getElementById('headerAvatarImg').src = p.avatar;
      document.getElementById('profileBigAvatar').src = p.avatar;
      if (p.banner) {
        document.getElementById('profileBanner').style.backgroundImage = `url(${p.banner})`;
      }

      document.getElementById('viewDisplayName').textContent = p.name || 'Sem nome';
      document.getElementById('viewDisplayHandle').textContent = p.handle || '@usuario';
      document.getElementById('viewDisplayBio').textContent = p.bio || 'Sem bio definida.';
      document.getElementById('viewFandomBias').textContent = p.fandomBias || '—';
      document.getElementById('viewDoramaAnime').textContent = p.doramaAnime || '—';
      document.getElementById('viewAboutInterview').textContent = p.aboutInterview || '—';
      document.getElementById('viewEmail').textContent = p.email || '—';

      document.getElementById('statFriendsCount').textContent = p.friendsCount;
      document.getElementById('statFandomsCount').textContent = p.fandomsCount;
      document.getElementById('statPostsCount').textContent = state.posts.length;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    syncProfileUI();
    updateDropletVisibility();
    renderFeed();
  </script>
</body>
</html>
